{% extends 'base.html' %}
{% block title %}Student Login{% endblock %}

{% block content %}
<div class="card" style="max-width: 450px; margin: 2rem auto;">
    <h2>Sign In to Tech Institute</h2>
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label>Username</label>
            {{ form.username }}
        </div>
        <div class="form-group">
            <label>Password</label>
            {{ form.password }}
        </div>
        <button type="submit" class="btn" style="width: 100%; margin-top: 0.5rem;">Login</button>
    </form>
    <p style="margin-top: 1rem; font-size: 0.9rem; text-align: center;">
        Don't have an account? <a href="{% url 'accounts:register' %}">Register here</a>
    </p>
</div>
{% endblock %}
